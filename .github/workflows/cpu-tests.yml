name: CPU tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: cmake -S . -B build-cpu -DCMAKE_BUILD_TYPE=Release -DORBITLAB_ENABLE_CUDA=OFF
      - run: cmake --build build-cpu --parallel 2
      - run: ctest --test-dir build-cpu --output-on-failure
      - run: python -m unittest discover -s scripts -p 'test_*.py'
        env:
          ORBITLAB_EXE: ${{ github.workspace }}/build-cpu/orbitlab
      - run: echo 'CUDA tests require a separate NVIDIA GPU run; this job validates CPU and Python.'
