name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA backends and runs the full ctest suite (CPU and CUDA tests) on a
# simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim). A
# simulator cannot reproduce hardware-specific behavior or timing, so it
# complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "cuda/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-tests:
    name: CUDA tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DORBITLAB_ENABLE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: cmake --build build-cuda -j3

      - name: Test
        run: vgpu run ctest --test-dir build-cuda --output-on-failure
